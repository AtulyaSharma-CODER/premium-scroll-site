<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aisha Chen — Brand & Strategy Consultant. I help ambitious founders build brands that sell. Strategy, positioning, visual identity, and launch systems for startups ready to scale." />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Aisha Chen — Brand & Strategy Consultant</title>
  </head>
  <body>
    <!-- Preloader -->
    <div id="preloader" class="preloader" role="status" aria-live="polite" aria-label="Loading portfolio">
      <div class="preloader__inner">
        <div class="preloader__counter" data-counter="0">0%</div>
        <div class="preloader__bar">
          <div class="preloader__progress"></div>
        </div>
        <div class="preloader__text">Loading experience...</div>
      </div>
    </div>

    <!-- Custom Cursor (Desktop only) -->
    <div id="cursor" class="cursor" aria-hidden="true">
      <div class="cursor__dot"></div>
      <div class="cursor__ring"></div>
    </div>

    <!-- Scroll Progress Indicator -->
    <div id="scroll-progress" class="scroll-progress" aria-hidden="true">
      <div class="scroll-progress__bar"></div>
    </div>

    <!-- Main App -->
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
